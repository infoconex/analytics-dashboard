name: Lab | Product comparison

on:
  pull_request:
    paths:
      - 'lab/ux13/**'
      - 'lab/ux14/**'
      - 'web/scripts/ux13/**'
      - 'web/scripts/ux14/**'
      - 'web/src/demoData.ts'
      - 'web/package*.json'
      - 'scripts/ci/verify-comparison-lab.sh'
      - '.github/workflows/comparison-lab.yml'
  workflow_dispatch:

concurrency:
  group: comparison-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compare:
    name: Lab | Fictional Elastic comparison and task evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout | Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup | Node.js 24 and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test | Pinned fixtures, access controls, screenshots and matched tasks
        env:
          UX14_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ./scripts/ci/verify-comparison-lab.sh
      - name: Evidence | Upload original screenshots and comparison review package
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fictional-product-comparison
          path: |
            lab/ux13/evidence/**
            lab/ux14/evidence/**
            lab/ux14/ux14-review-package.zip
          if-no-files-found: warn
          retention-days: 14
