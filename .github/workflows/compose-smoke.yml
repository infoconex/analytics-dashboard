name: Environment | Compose smoke

on:
  pull_request:
    paths:
      - 'compose.ux16-owner.yml'
      - 'scripts/ci/verify-compose-smoke.sh'
      - '.github/workflows/compose-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'compose.ux16-owner.yml'
      - 'scripts/ci/verify-compose-smoke.sh'
      - '.github/workflows/compose-smoke.yml'
  workflow_dispatch:

concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Environment | Sample host and port isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout | Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test | Start, validate and remove disposable Compose fixtures
        run: bash ./scripts/ci/verify-compose-smoke.sh
