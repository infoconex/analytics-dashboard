name: Verify

on:
  pull_request:
  push:
    branches: [main]

# A newer PR head supersedes older checks. Main pushes always run to completion.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: .NET and web tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore cached NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Run locally reproducible .NET, web and fictional lab verification
        shell: pwsh
        run: ./scripts/verify.ps1

  browser:
    name: Browser E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore cached NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore cached Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Build isolated API and run Playwright shard
        shell: pwsh
        run: ./scripts/verify-browser.ps1 -ShardIndex ${{ matrix.shard }} -ShardTotal 4
      - name: Publish sample-only screenshots and failure recordings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ux-visual-evidence-shard-${{ matrix.shard }}
          path: |
            web/test-results/**/*.png
            web/test-results/**/*.webm
            web/test-results/**/*.json
            web/test-results/**/trace.zip
          if-no-files-found: warn
          retention-days: 14

  provider-conformance:
    name: Real SQL Server and PostgreSQL adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore cached NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Start isolated provider fixtures with ephemeral passwords
        shell: bash
        run: bash ./scripts/start-provider-fixtures.sh
      - name: Run mandatory real-provider conformance tests
        shell: pwsh
        run: ./scripts/verify-provider-adapters.ps1
      - name: Remove disposable provider containers
        if: always()
        shell: bash
        run: |
          docker rm -f analytics-sqlserver-fixture analytics-postgres-fixture 2>/dev/null || true
