name: Lab | UX-16 owner Compose smoke

on:
  pull_request:
    paths:
      - 'compose.ux16-owner.yml'
      - 'docs/ux16-owner-docker-review.md'
      - 'scripts/ci/verify-owner-compose.sh'
      - '.github/workflows/ux16-owner-docker.yml'
  push:
    branches: [main]
    paths:
      - 'compose.ux16-owner.yml'
      - 'docs/ux16-owner-docker-review.md'
      - 'scripts/ci/verify-owner-compose.sh'
      - '.github/workflows/ux16-owner-docker.yml'
  workflow_dispatch:

concurrency:
  group: ux16-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  owner-compose:
    name: Lab | Owner Compose lifecycle and port isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout | Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test | Start, inspect and remove owner Compose fixtures
        run: bash ./scripts/ci/verify-owner-compose.sh
