name: UX13 Lab Smoke

on:
  pull_request:
    paths:
      - 'lab/ux13/**'
      - 'web/scripts/ux13/**'
      - 'web/src/demoData.ts'
      - 'web/package*.json'
      - '.github/workflows/ux13-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Disposable Elastic 9.5.6 fixture and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare local-only test dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Bootstrap disposable 9.5.6 services and validate fictional records/permissions
        run: bash lab/ux13/lab.sh up
      - name: Install isolated Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Capture genuine Kibana UI, viewport, forced-colors and native zoom evidence
        working-directory: web
        shell: bash
        run: |
          set -a
          source ../lab/ux13/secrets.env
          set +a
          node scripts/ux13/kibana-browser.mjs
      - name: Upload fictional lab evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ux13-fictional-lab
          path: lab/ux13/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy exact disposable lab resources
        if: always()
        run: |
          if test -f lab/ux13/secrets.env; then bash lab/ux13/lab.sh down; fi
