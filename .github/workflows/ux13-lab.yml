name: Lab | UX-13 Elastic smoke

on:
  pull_request:
    paths:
      - 'lab/ux13/**'
      - 'web/scripts/ux13/**'
      - 'web/src/demoData.ts'
      - 'web/package*.json'
      - 'docs/ux13-independent-lab.md'
      - 'docs/ux12-independent-evaluation.md'
      - 'docs/ux12-task-matrix.csv'
      - 'scripts/ci/verify-ux13-lab.sh'
      - '.github/workflows/ux13-lab.yml'
  workflow_dispatch:

concurrency:
  group: ux13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ux13:
    name: Lab | Disposable UX-13 browser comparison
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout | Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup | Node.js 24 and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test | Provision, compare and clean up UX-13 lab
        run: bash ./scripts/ci/verify-ux13-lab.sh
      - name: Evidence | Upload fictional UX-13 artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ux13-fictional-lab
          path: lab/ux13/evidence/
          if-no-files-found: warn
          retention-days: 7
