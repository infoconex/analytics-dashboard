# UX-16: local-only, fictional-data product-owner walkthrough.
# Use only against Analytics Dashboard main 1562af1a979cdc61aeacb04befaaaf7c2a52ea47.
# Not production deployment, tenant authorization validation, or an embedding contract.
# Open http://localhost:5173 after both services are ready.
name: analytics-ux16-owner

services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command:
      - dotnet
      - run
      - --no-launch-profile
      - --project
      - src/AnalyticsDashboard.Api
      - --
      - --urls
      - http://0.0.0.0:5055
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    ports:
      # Web is published through the shared network namespace below.
      # No public or LAN-facing binds; the .NET API itself is not published.
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/workspace
      - ux16-catalog:/workspace/data
    init: true
    restart: "no"
    stop_grace_period: 30s

  web:
    image: node:24.22.3-bookworm-slim
    working_dir: /workspace/web
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && npm run dev
    depends_on:
      - api
    # Vite's checked-in /api proxy targets localhost:5055.
    # Share the API's container network namespace so that localhost is correct
    # without modifying application code or broadening the API contract.
    network_mode: "service:api"
    volumes:
      - ./:/workspace
      - ux16-node-modules:/workspace/web/node_modules
    init: true
    restart: "no"
    stop_grace_period: 30s

volumes:
  # Keep only fictional dashboard-definition metadata across restarts.
  ux16-catalog:
  ux16-node-modules:
